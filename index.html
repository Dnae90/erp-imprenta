<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket ERP · Imprentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F0EA;
    --paper-raised:#FFFFFF;
    --ink:#1E2124;
    --ink-soft:#5B5F63;
    --line:#D9D6CC;
    --sidebar:#15171A;
    --sidebar-text:#C9CCCF;
    --sidebar-text-dim:#797E82;
    --press-blue:#1D4E89;
    --press-blue-dark:#163C69;
    --cyan:#0090B5;
    --magenta:#B8005E;
    --yellow:#B98A00;
    --green:#2E7D5E;
    --red:#B23E22;
    --focus:#1D4E89;
    font-family:"IBM Plex Sans", sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1C1E;
      --paper-raised:#232527;
      --ink:#E7E6E2;
      --ink-soft:#9A9D9F;
      --line:#37393B;
      --sidebar:#0E0F11;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1C1E;
    --paper-raised:#232527;
    --ink:#E7E6E2;
    --ink-soft:#9A9D9F;
    --line:#37393B;
    --sidebar:#0E0F11;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.brand,.nav-label{font-family:"Space Grotesk", sans-serif;}
  .mono{font-family:"IBM Plex Mono", monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--press-blue);color:#fff;}
  *:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;flex:none;background:var(--sidebar);color:var(--sidebar-text);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;padding:20px 18px 16px 18px;
    border-bottom:1px solid #2A2C2F;
  }
  .brand-mark{
    width:26px;height:26px;flex:none;position:relative;
  }
  .brand-mark svg{width:100%;height:100%;}
  .brand-name{font-size:15px;font-weight:600;color:#F2F1EC;line-height:1.2;}
  .brand-sub{font-size:11px;color:var(--sidebar-text-dim);font-family:"IBM Plex Mono",monospace;}

  .nav{padding:10px 10px;flex:1;}
  .nav-group-title{
    font-size:11px;color:var(--sidebar-text-dim);padding:14px 10px 6px 10px;
    letter-spacing:.02em;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;color:var(--sidebar-text);
    padding:9px 10px;border-radius:4px;font-size:13.5px;cursor:pointer;
    border-left:3px solid transparent;margin-bottom:1px;
  }
  .nav-item:hover{background:#1F2124;color:#F2F1EC;}
  .nav-item.active{background:#1F2124;color:#F2F1EC;border-left-color:var(--cyan);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--sidebar-text-dim);flex:none;}
  .nav-item.active .dot{background:var(--cyan);}

  .sidebar-foot{
    padding:14px 18px;border-top:1px solid #2A2C2F;font-size:11.5px;color:var(--sidebar-text-dim);
    font-family:"IBM Plex Mono",monospace;
  }

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:22px 28px 14px 28px;border-bottom:1px solid var(--line);
    background:var(--paper);position:sticky;top:0;z-index:5;
  }
  .topbar .crumb{font-size:12px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;margin-bottom:4px;}
  .topbar h1{font-size:22px;margin:0;font-weight:600;}
  .topbar .actions{display:flex;gap:8px;flex-wrap:wrap;}

  .content{padding:22px 28px 60px 28px;}

  /* ---------- Building blocks ---------- */
  .btn{
    border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);
    padding:8px 14px;border-radius:4px;font-size:13.5px;cursor:pointer;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--press-blue);border-color:var(--press-blue);color:#fff;}
  .btn-primary:hover{background:var(--press-blue-dark);border-color:var(--press-blue-dark);}
  .btn-danger{color:var(--red);}
  .btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-danger-solid:hover{background:#95331b;border-color:#95331b;}
  .btn-sm{padding:4px 9px;font-size:12.5px;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--line);}

  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
  .kpi{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
  }
  .kpi .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-size:24px;font-weight:600;font-family:"IBM Plex Mono",monospace;}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;margin-bottom:20px;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .panel-head h3{font-size:14.5px;margin:0;font-weight:600;}
  .panel-body{padding:14px 16px;}
  .panel-body.no-pad{padding:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-weight:500;color:var(--ink-soft);font-size:12px;
    padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:color-mix(in srgb, var(--paper) 60%, transparent);}
  .num{font-family:"IBM Plex Mono",monospace;text-align:right;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .tag{
    display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;
    font-size:11.5px;font-weight:500;border:1px solid transparent;
  }
  .tag-cyan{background:color-mix(in srgb, var(--cyan) 14%, transparent);color:var(--cyan);}
  .tag-magenta{background:color-mix(in srgb, var(--magenta) 14%, transparent);color:var(--magenta);}
  .tag-yellow{background:color-mix(in srgb, var(--yellow) 16%, transparent);color:var(--yellow);}
  .tag-green{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green);}
  .tag-red{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red);}
  .tag-grey{background:color-mix(in srgb, var(--ink-soft) 14%, transparent);color:var(--ink-soft);}

  .empty{padding:36px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .empty .big{font-size:26px;margin-bottom:6px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab{
    padding:9px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
    color:var(--ink-soft);font-size:13.5px;cursor:pointer;font-weight:500;margin-right:16px;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--press-blue);}

  /* forms */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;
    background:var(--paper-raised);color:var(--ink);font-size:13.5px;font-family:inherit;
  }
  .field textarea{min-height:64px;resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;}
  .checkline input{width:auto;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,16,17,.45);display:none;
    align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-raised);border-radius:8px;width:100%;max-width:560px;
    border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18);
  }
  .modal.wide{max-width:760px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:15.5px;}
  .modal-body{padding:18px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:5px;font-size:13px;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
  }
  :root[data-theme="dark"] .toast, .toast{background:#14161A;color:#F2F1EC;}

  .steps{display:flex;gap:0;margin:4px 0 20px 0;}
  .step{flex:1;text-align:center;position:relative;padding-bottom:10px;}
  .step .n{
    width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px auto;font-size:12px;
    font-family:"IBM Plex Mono",monospace;font-weight:600;
  }
  .step.done .n{background:var(--green);color:#fff;}
  .step.current .n{background:var(--press-blue);color:#fff;}
  .step .lbl{font-size:11.5px;color:var(--ink-soft);}
  .step.current .lbl, .step.done .lbl{color:var(--ink);}
  .step::after{
    content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--line);z-index:-1;
  }
  .step:first-child::after{left:50%;}
  .step:last-child::after{display:none;}
  .step.done::after{background:var(--green);}

  .line-table input, .line-table select{padding:6px 8px;font-size:13px;}
  .quote-print{display:none;}

  .helpbar{
    display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb, var(--press-blue) 8%, transparent);
    border:1px solid color-mix(in srgb, var(--press-blue) 30%, transparent);border-radius:6px;
    padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;
  }

  @media(max-width:880px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .18s ease;z-index:60;box-shadow:0 0 0 2000px rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0);box-shadow:12px 0 30px rgba(0,0,0,.3);}
    .menu-btn{display:inline-flex !important;}
    .content{padding:16px 14px 50px 14px;}
    .topbar{padding:16px 14px 12px 14px;}
    .field-row,.field-row3{grid-template-columns:1fr;}
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;}
    .sidebar-scrim.open{display:block;}
  }
  .menu-btn{display:none;border:1px solid var(--line);background:var(--paper-raised);border-radius:5px;padding:7px 9px;cursor:pointer;}

  @media print{
    body *{visibility:hidden;}
    .quote-print, .quote-print *{visibility:visible;}
    .quote-print{display:block;position:absolute;top:0;left:0;width:100%;padding:24px;}
  }
</style>
</head>

const STORE_KEY = "erp_imprenta_v1";
let state = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){ /* ignora storage corrupto */ }
  state = JSON.parse(JSON.stringify(SEED));
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);

    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* almacenamiento no disponible */ }

}

/* ================= Modal genérico ================= */
function openModal({title, bodyHTML, footHTML, wide}){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHTML;
  $("#modalFoot").innerHTML = footHTML || "";
  $("#modal").classList.toggle("wide", !!wide);
  $("#overlay").classList.add("open");
}
function closeModal(){ $("#overlay").classList.remove("open"); }
$("#modalClose").addEventListener("click", closeModal);
$("#overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") closeModal(); });

function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  openModal({
    title: opts.title || "Confirmar acción",
    bodyHTML: `<p style="margin:0;font-size:13.5px;">${esc(message)}</p>`,
    footHTML: `<button class="btn" data-cancel>Cancelar</button><button class="btn btn-danger-solid" id="confirmYesBtn">${esc(opts.confirmLabel || "Sí, continuar")}</button>`
  });
  $("#confirmYesBtn").addEventListener("click", ()=>{ closeModal(); onConfirm(); });
}

/* ================= Helpers de UI compartidos ================= */
function tagForStatus(status){
  const map = {
    activo:["tag-green","Activo"], incapacidad:["tag-yellow","Incapacidad"], baja:["tag-grey","Baja"],
    disponible:["tag-cyan","Disponible"], reutilizado:["tag-green","Reutilizado"], desechado:["tag-grey","Desechado"],
    pendiente:["tag-yellow","Pendiente"], en_proceso:["tag-cyan","En proceso"], terminado:["tag-green","Terminado"], entregado:["tag-green","Entregado"],
    aprobada:["tag-green","Aprobada"], rechazada:["tag-red","Rechazada"], convertida:["tag-cyan","Convertida"],
    recibida:["tag-green","Recibida"],
  };
  const [cls,label] = map[status] || ["tag-grey", status];
  return `<span class="tag ${cls}">${esc(label)}</span>`;
}
function setPage(title, crumb, actionsHTML){
  $("#pageTitle").textContent = title;
  $("#crumb").textContent = crumb;
  $("#pageActions").innerHTML = actionsHTML || "";
}
function emptyState(icon, text){
  return `<div class="empty"><div class="big">${icon}</div>${esc(text)}</div>`;
}

  return `

      <div class="panel-body no-pad">

      </div>
    </div>`;
}
function purchaseLineRow(idx, item){
  const materialOptions = state.materials.map(m=>`<option value="${esc(m.name)}" data-cost="${m.unitCost}" ${item.material===m.name?"selected":""}>${esc(m.name)}</option>`).join("");
  return `<tr data-line="${idx}">
    <td><select class="line-material">${materialOptions}</select></td>
    <td><input class="line-qty num" type="number" step="0.01" value="${item.qty}" style="width:80px"></td>
    <td><input class="line-cost num" type="number" step="0.01" value="${item.unitCost}" style="width:90px"></td>
    <td class="num line-sub">${fmtMoney(item.qty*item.unitCost)}</td>
    <td><button class="btn btn-sm btn-ghost btn-danger" data-remove-line="${idx}">✕</button></td>
  </tr>`;
}
function renderPurchaseLines(){
  const tbody = $("#purchaseLines");
  if(!tbody) return;
  tbody.innerHTML = purchaseDraftItems.map((it,idx)=>purchaseLineRow(idx,it)).join("");
  let total = purchaseDraftItems.reduce((a,b)=>a+(b.qty*b.unitCost),0);
  $("#purchaseTotal").textContent = fmtMoney(total);
  $$(".line-material", tbody).forEach((sel,idx)=>{
    sel.addEventListener("change", ()=>{
      purchaseDraftItems[idx].material = sel.value;
      const opt = sel.selectedOptions[0];
      if(opt && opt.dataset.cost){ purchaseDraftItems[idx].unitCost = parseFloat(opt.dataset.cost)||0; }
      renderPurchaseLines();
    });
  });
  $$(".line-qty", tbody).forEach((inp,idx)=>{ inp.addEventListener("input", ()=>{ purchaseDraftItems[idx].qty = parseFloat(inp.value)||0; renderPurchaseLines(); }); });
  $$(".line-cost", tbody).forEach((inp,idx)=>{ inp.addEventListener("input", ()=>{ purchaseDraftItems[idx].unitCost = parseFloat(inp.value)||0; renderPurchaseLines(); }); });
  $$("[data-remove-line]", tbody).forEach(btn=>{ btn.addEventListener("click", ()=>{ purchaseDraftItems.splice(parseInt(btn.dataset.removeLine),1); renderPurchaseLines(); }); });
}
function openCompraModal(){
  purchaseDraftItems = state.materials[0] ? [{material:state.materials[0].name, qty:1, unitCost:state.materials[0].unitCost}] : [];
  const supplierOptions = state.suppliers.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");
  openModal({
    title:"Nueva orden de compra", wide:true,
    bodyHTML:`
      <div class="field-row">
        <div class="field"><label>Proveedor</label><select id="f_supplier">${supplierOptions}</select></div>
        <div class="field"><label>Fecha</label><input id="f_date" type="date" value="${todayISO()}"></div>
      </div>
      <table class="line-table">
        <thead><tr><th>Material</th><th>Cantidad</th><th>Costo unit.</th><th>Subtotal</th><th></th></tr></thead>
        <tbody id="purchaseLines"></tbody>
      </table>
      <button class="btn btn-sm" id="addLine" style="margin-top:10px;">+ Agregar material</button>
      <div style="text-align:right;margin-top:14px;font-size:15px;">Total: <strong class="mono" id="purchaseTotal"></strong></div>
    `,
    footHTML:`<button class="btn" data-cancel>Cancelar</button><button class="btn btn-primary" id="saveCompra">Guardar compra</button>`
  });
  renderPurchaseLines();
  $("#addLine").addEventListener("click", ()=>{
    const m = state.materials[0];
    purchaseDraftItems.push({material: m?m.name:"", qty:1, unitCost:m?m.unitCost:0});
    renderPurchaseLines();
  });
  $("#saveCompra").addEventListener("click", ()=>{
    if(purchaseDraftItems.length===0){ toast("Agrega al menos un material."); return; }
    const total = purchaseDraftItems.reduce((a,b)=>a+(b.qty*b.unitCost),0);
    state.purchases.push({ id:uid("cmp"), date:$("#f_date").value||todayISO(), supplier:$("#f_supplier").value,
      items: JSON.parse(JSON.stringify(purchaseDraftItems)), total, status:"pendiente" });
    save(); closeModal(); render(); toast("Compra registrada.");
  });
}

function drawQuotePDF(doc, q){
  const marginX = 54, pageW = 612, rightX = pageW - marginX;
  let y = 60;
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(30,33,36);
  doc.text("Tiraje · ERP Imprentas", marginX, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(91,95,99);
  doc.text("Culiacán, Sinaloa", marginX, y+14);
  doc.setFont("courier","bold"); doc.setFontSize(13); doc.setTextColor(30,33,36);
  doc.text(q.folio, rightX, y, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(91,95,99);
  doc.text(fmtDate(q.date), rightX, y+14, {align:"right"});

  y += 28;
  doc.setDrawColor(29,78,137); doc.setLineWidth(1.5); doc.line(marginX, y, rightX, y);
  y += 24;

  doc.setFontSize(8.5); doc.setTextColor(91,95,99); doc.text("CLIENTE", marginX, y);
  y += 14;
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(30,33,36);
  doc.text(String(q.client.name||"—"), marginX, y);
  y += 14;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(91,95,99);
  doc.text(`${q.client.phone||""}  ${q.client.email? "· "+q.client.email : ""}`.trim(), marginX, y);
  y += 26;

  const colQty=340, colPrice=460, colSub=rightX;
  doc.setFontSize(8.5); doc.setTextColor(91,95,99);
  doc.text("SERVICIO", marginX, y);
  doc.text("CANT.", colQty, y, {align:"right"});
  doc.text("P. UNITARIO", colPrice, y, {align:"right"});
  doc.text("SUBTOTAL", colSub, y, {align:"right"});
  y += 6;
  doc.setDrawColor(217,214,204); doc.setLineWidth(0.75); doc.line(marginX, y, rightX, y);
  y += 16;

  doc.setFontSize(10);
  q.items.forEach(it=>{
    doc.setFont("helvetica","normal"); doc.setTextColor(30,33,36);
    doc.text(String(it.service), marginX, y, {maxWidth: colQty-marginX-10});
    doc.text(String(it.qty), colQty, y, {align:"right"});
    doc.setFont("courier","normal");
    doc.text(fmtMoney(it.unitPrice), colPrice, y, {align:"right"});
    doc.text(fmtMoney(it.subtotal), colSub, y, {align:"right"});
    y += 10;
    doc.setDrawColor(239,237,230); doc.setLineWidth(0.5); doc.line(marginX, y, rightX, y);
    y += 16;
  });

  y += 4;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(30,33,36);
  doc.text("Subtotal", colPrice, y, {align:"right"});
  doc.setFont("courier","normal"); doc.text(fmtMoney(q.subtotal), colSub, y, {align:"right"});
  y += 16;
  doc.setFont("helvetica","normal"); doc.text("IVA (16%)", colPrice, y, {align:"right"});
  doc.setFont("courier","normal"); doc.text(fmtMoney(q.iva), colSub, y, {align:"right"});
  y += 10;
  doc.setDrawColor(29,78,137); doc.setLineWidth(1.2); doc.line(colPrice-90, y, rightX, y);
  y += 18;
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Total", colPrice, y, {align:"right"});
  doc.setFont("courier","bold"); doc.text(fmtMoney(q.total), colSub, y, {align:"right"});

  if(q.notes){
    y += 30;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(91,95,99);
    doc.text("Notas: " + q.notes, marginX, y, {maxWidth: rightX-marginX});
  }

  doc.setFontSize(8); doc.setTextColor(154,157,159);
  doc.text("Cotización válida por 15 días. Precios en pesos mexicanos.", marginX, 760);
}

async function exportQuotePDF(q){
  if(window.jspdf && window.jspdf.jsPDF){
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:"pt", format:"letter"});
      drawQuotePDF(doc, q);
      const blob = doc.output("blob");
      try{
        const downloads = window.claude ? await window.claude.use("downloads") : null;
        if(downloads){
          await downloads.save({ filename: `${q.folio}.pdf`, data: blob });
          toast("PDF descargado.");
          return;
        }
      }catch(e){ /* si el permiso falla, abrimos el PDF en una pestaña */ }
      window.open(doc.output("bloburl"), "_blank");
      return;
    }catch(e){ /* seguimos con el respaldo de impresión */ }
  }
  // Respaldo si la librería de PDF no llegó a cargar: vista imprimible del navegador.
  const container = $("#quotePrint");
  container.innerHTML = buildQuotePrintHTML(q);
  window.print();
}

function convertQuoteToOT(id){
  const q = state.quotes.find(x=>x.id===id);
  if(!q) return;
  if(q.status==="convertida"){ toast("Esta cotización ya fue convertida."); return; }
  const folio = "OT-" + (state.meta.otSeq++);
  state.workorders.push({
    id: uid("ot"), folio, date: todayISO(), client: q.client.name, quoteFolio: q.folio,
    items: q.items.map(it=>({service:it.service, qty:it.qty, notes:""})),
    status:"pendiente", assignedTo:"", dueDate:"", notes:`Convertida desde cotización ${q.folio}.`
  });
  q.status = "convertida";
  save(); render(); toast(`Orden de trabajo ${folio} creada desde ${q.folio}.`);
  currentView = "ordenes"; render();
}

function revertQuoteConversion(id){
  const q = state.quotes.find(x=>x.id===id);
  if(!q || q.status!=="convertida") return;
  const linkedOT = state.workorders.find(o=>o.quoteFolio===q.folio);
  const doRevert = ()=>{
    if(linkedOT){ state.workorders = state.workorders.filter(o=>o.id!==linkedOT.id); }
    q.status = "pendiente";
    save(); render(); toast(`Cotización ${q.folio} regresó a estado pendiente.`);
  };
  if(linkedOT){
    confirmAction(`Esto eliminará la orden de trabajo ${linkedOT.folio} generada a partir de ${q.folio}. ¿Continuar?`, doRevert, {confirmLabel:"Sí, deshacer"});
  } else {
    doRevert();
  }
}

function render(){
  renderNav();
  let html = "";
  if(currentView==="dashboard") html = viewDashboard();
  else if(currentView==="servicios") html = viewServicios();
  else if(currentView==="inventario") html = viewInventario();
  else if(currentView==="proveedores") html = viewProveedores();
  else if(currentView==="compras") html = viewCompras();
  else if(currentView==="finanzas") html = viewFinanzas();
  else if(currentView==="rh") html = viewRH();

    });
  }
  if(!c.contains($("#q_client"))) { /* refresca listeners de q_ solo si están presentes, ya cubierto arriba */ }
  const qClientInput = $("#q_client"); if(qClientInput) qClientInput.addEventListener("input", ()=>{ quoteDraft.client.name = qClientInput.value; });
  const qPhoneInput = $("#q_phone"); if(qPhoneInput) qPhoneInput.addEventListener("input", ()=>{ quoteDraft.client.phone = qPhoneInput.value; });
  const qEmailInput = $("#q_email"); if(qEmailInput) qEmailInput.addEventListener("input", ()=>{ quoteDraft.client.email = qEmailInput.value; });
  const qNotesInput = $("#q_notes"); if(qNotesInput) qNotesInput.addEventListener("input", ()=>{ quoteDraft.notes = qNotesInput.value; });

  // Cotizaciones
  $$("[data-view-quote]", c).forEach(b=> b.addEventListener("click", ()=>openQuoteModal(b.dataset.viewQuote)));
  $$("[data-convert-quote]", c).forEach(b=> b.addEventListener("click", ()=>convertQuoteToOT(b.dataset.convertQuote)));
  $$("[data-revert-quote]", c).forEach(b=> b.addEventListener("click", ()=>revertQuoteConversion(b.dataset.revertQuote)));
  $$("[data-del-quote]", c).forEach(b=> b.addEventListener("click", ()=>{
    confirmAction("¿Eliminar esta cotización?", ()=>{ state.quotes = state.quotes.filter(q=>q.id!==b.dataset.delQuote); save(); render(); toast("Cotización eliminada."); });
  }));

  // Órdenes de trabajo
  const addOT = $("#addOT"); if(addOT) addOT.addEventListener("click", openNewOTModal);
  $$("[data-view-ot]", c).forEach(b=> b.addEventListener("click", ()=>openOTModal(b.dataset.viewOt)));
  $$("[data-del-ot]", c).forEach(b=> b.addEventListener("click", ()=>{
    confirmAction("¿Eliminar esta orden de trabajo?", ()=>{ state.workorders = state.workorders.filter(o=>o.id!==b.dataset.delOt); save(); render(); toast("Orden eliminada."); });
  }));
}

/* ================= Init ================= */
loadState();
render();

})();
</script>
</body>
</html>
